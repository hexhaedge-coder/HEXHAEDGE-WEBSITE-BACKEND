# Render Blueprint: Render → New → Blueprint → pick this repository.
# Creates the API (web service) and the scheduled-jobs runner (cron job), sharing one set of settings.
# Frankfurt is the Render region closest to Kenya.
#
# Secrets are NOT in this file (Render does not allow them in an environment group here).
# After the Blueprint is created, add them once in Render → Environment Groups → hexhaedge-shared:
#   FIREBASE_SERVICE_ACCOUNT_BASE64, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#   ADMIN_ALERT_EMAIL, ADMIN_ALERT_PHONE, and later the M-Pesa, SMS, WhatsApp and email keys
#   (full list in .env.example). Render keeps values added in the dashboard.

envVarGroups:
  - name: hexhaedge-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_STORAGE_BUCKET
        value: hexhaedge-website.firebasestorage.app
      - key: APP_URL
        value: https://hexhaedge.com
      # Change PUBLIC_API_URL if Render gives the API a different address.
      - key: PUBLIC_API_URL
        value: https://hexhaedge-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://hexhaedge.com,https://www.hexhaedge.com,https://hexhaedge-website.hexhaedge.workers.dev
      - key: REQUIRE_STAFF_MFA
        value: "true"
      - key: ENFORCE_APP_CHECK
        value: "false"
      - key: CRON_TOKEN
        generateValue: true
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_TILL_OR_PAYBILL
        value: paybill
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: AT_USERNAME
        value: sandbox
      - key: EMAIL_FROM
        value: HexhaEdge <no-reply@hexhaedge.com>
      - key: CLOUDINARY_CLOUD_NAME
        value: btzphyp2

services:
  - type: web
    name: hexhaedge-api
    runtime: node
    region: frankfurt
    plan: starter            # paid: never sleeps, so M-Pesa callbacks and members never wait for a cold start
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: hexhaedge-shared

  - type: cron
    name: hexhaedge-jobs
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"  # every 5 minutes; jobs decide in Nairobi time whether they are due
    buildCommand: npm install --omit=dev
    startCommand: node src/cron.js
    envVars:
      - fromGroup: hexhaedge-shared

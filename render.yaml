# Render Blueprint: Render → New → Blueprint → pick this repository.
# Creates the API (web service) and the scheduled-jobs runner (cron job), sharing one set of settings.
# Frankfurt is the Render region closest to Kenya. Values marked sync: false are asked for in the dashboard.

envVarGroups:
  - name: hexhaedge-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        value: hexhaedge-website.firebasestorage.app
      - key: APP_URL
        value: https://hexhaedge-website.hexhaedge.workers.dev
      - key: PUBLIC_API_URL
        value: https://hexhaedge-api.onrender.com   # change if Render gives the service a different address
      - key: ALLOWED_ORIGINS
        value: https://hexhaedge-website.hexhaedge.workers.dev
      - key: REQUIRE_STAFF_MFA
        value: "true"
      - key: ENFORCE_APP_CHECK
        value: "false"
      - key: CRON_TOKEN
        generateValue: true
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_TILL_OR_PAYBILL
        value: paybill
      - key: MPESA_PARTY_B
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: btzphyp2
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_ALERT_PHONE
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false

services:
  - type: web
    name: hexhaedge-api
    runtime: node
    region: frankfurt
    plan: starter            # paid: never sleeps, so M-Pesa callbacks and members never wait for a cold start
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: hexhaedge-shared

  - type: cron
    name: hexhaedge-jobs
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"  # every 5 minutes; jobs decide in Nairobi time whether they are due
    buildCommand: npm install --omit=dev
    startCommand: node src/cron.js
    envVars:
      - fromGroup: hexhaedge-shared
